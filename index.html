<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy 17th Birthday Baby ❤️</title>

    <!-- CSS -->
    <link rel="stylesheet" href="hbd.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

    <!-- Background Music -->
    <audio id="music" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

    

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
    </div>

    <!-- Stars -->
    <div class="stars"></div>

    <!-- Balloons -->
    <div class="balloon balloon1"></div>
    <div class="balloon balloon2"></div>
    <div class="balloon balloon3"></div>
    <div class="balloon balloon4"></div>

    <!-- Main Content -->
    <div class="container">

        <h1 class="title">
            Happy Birthday
            <span>Edisa Mae ❤️</span>
        </h1>

        <p class="subtitle">
            I made something special just for you...
        </p>

        <!-- Cake -->
        <div class="cake">

            <div class="candle">
                <div class="flame" id="flame"></div>
            </div>

            <div class="top-layer">
                <div class="icing"></div>
            </div>

            <div class="middle-layer"></div>

            <div class="bottom-layer"></div>

            <div class="plate"></div>

        </div>

        <!-- Blow Button -->
        <button id="blowBtn" class="btn">
            🕯️ Blow the Candle
        </button>

        <!-- Smoke -->
        <div id="smoke" class="smoke hidden">
            💨
        </div>

        <!-- Gift Button -->
        <button id="giftBtn" class="btn hidden">
            🎁 Open My Present
        </button>

        <!-- Gift -->
        <div id="giftBox" class="gift hidden">

            <div class="lid"></div>

            <div class="box"></div>

            <div class="ribbon-vertical"></div>

            <div class="ribbon-horizontal"></div>

        </div>

        <!-- Letter -->
        <div id="letter" class="letter hidden">

            <h2>❤️ Happy 17th Birthday Baby ❤️</h2>

            <div id="typewriter" class="typewriter"></div>

            <button id="loveBtn" class="btn hidden">
                ❤️ Click Me
            </button>

        </div>

    </div>

    <!-- Final Screen -->
    <div id="ending" class="ending hidden">

        <h1>I Love You Baby ❤️</h1>

        <h3>Forever & Always</h3>

    </div>

    <!-- JavaScript -->
    <script src="hbd.js"></script>

</body>

</html>
